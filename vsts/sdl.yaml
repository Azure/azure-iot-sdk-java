name: $(BuildID)_$(BuildDefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)
resources:
- repo: self
  clean: true

jobs:
### SDL Tasks ###
- job: SDL
  displayName: SDL Tasks

  variables:
    # Owns the 'java' CodeQL snapshot for this repo (Microsoft.Security.CodeQL.10000).
    # CodeQL traces the maven build below, so this job -- not an incidentally
    # instrumented e2e or provisioning job -- is what S360 records.
    # Only on main: this pipeline also runs on PRs, which do not need a snapshot.
    # See https://aka.ms/codeql3000 and https://aka.ms/sdlfaqcodeql.
    Codeql.Enabled: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
    Codeql.Language: java

  condition: succeeded()
  pool:
    vmImage: windows-latest
    timeoutInMinutes: 60
  steps:
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: 11
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'
      
  - task: CodeQL3000Init@0
    displayName: 'Initialize CodeQL'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  - powershell: ./vsts/package_repo_for_sdl.ps1
    displayName: 'Build packages to scan'

  # Must follow the maven build above: CodeQL builds the java database from the
  # traced compilation. always() so a build failure still surfaces the CodeQL
  # status instead of silently skipping the upload, but still only on main.
  - task: CodeQL3000Finalize@0
    displayName: 'Finalize CodeQL'
    condition: and(always(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  - task: ms.vss-governance-buildtask.governance-build-task-component-detection.ComponentGovernanceComponentDetection@0
    displayName: 'Component Detection'
    inputs:
      alertWarningLevel: High
      failOnAlert: true
      sourceScanPath: './iothub/device/iot-device-client/'

  - task: ms.vss-governance-buildtask.governance-build-task-component-detection.ComponentGovernanceComponentDetection@0
    displayName: 'Component Detection'
    inputs:
      alertWarningLevel: High
      failOnAlert: true
      sourceScanPath: './provisioning/provisioning-device-client/'

  - task: ms.vss-governance-buildtask.governance-build-task-component-detection.ComponentGovernanceComponentDetection@0
    displayName: 'Component Detection'
    inputs:
      alertWarningLevel: High
      failOnAlert: true
      sourceScanPath: './provisioning/provisioning-service-client/'

  - task: ms.vss-governance-buildtask.governance-build-task-component-detection.ComponentGovernanceComponentDetection@0
    displayName: 'Component Detection'
    inputs:
      alertWarningLevel: High
      failOnAlert: true
      sourceScanPath: './provisioning/security/'

  - task: securedevelopmentteam.vss-secure-development-tools.build-task-credscan.CredScan@3
    displayName: CredScan
    inputs:
      debugMode: false
      suppressionsFile: vsts/CredScanSuppressions.json

    ## Spotbugs doesn't have a false positive list, but instead recommends annotating the lines of code in question
    ## with annotations like @SuppressFBWarnings("MS_SHOULD_BE_FINAL")
  - powershell: ./vsts/spotbugs.ps1
    displayName: 'Run Spotbugs'

  - task: securedevelopmentteam.vss-secure-development-tools.build-task-policheck.PoliCheck@2
    displayName: PoliCheck
    inputs:
      targetType: F
   
  - task: AntiMalware@4
    inputs:
      InputType: 'Basic'
      ScanType: 'CustomScan'
      FileDirPath: '$(Build.StagingDirectory)'
      TreatSignatureUpdateFailureAs: 'Warning'
      SignatureFreshness: 'UpToDate'
      TreatStaleSignatureAs: 'Error'

  - task: securedevelopmentteam.vss-secure-development-tools.build-task-publishsecurityanalysislogs.PublishSecurityAnalysisLogs@3
    displayName: 'Publish Security Analysis Logs'

  - task: securedevelopmentteam.vss-secure-development-tools.build-task-postanalysis.PostAnalysis@2
    displayName: 'Post Analysis'
    inputs:
      CredScan: true

  - task: securedevelopmentteam.vss-secure-development-tools.build-task-uploadtotsa.TSAUpload@2
    displayName: 'TSA upload'
    inputs:
      GdnPublishTsaOnboard: false
      GdnPublishTsaConfigFile: '$(Build.SourcesDirectory)/vsts/TsaUploadConfigFile.json'
      GdnPublishTsaExportedResultsPublishable: true